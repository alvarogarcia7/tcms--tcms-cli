[package]
name = "requirement-import"
version = "0.1.0"
edition = "2021"
description = "Requirement source adapters (Jira features, StrictDoc export) that write requirement YAML"

[dependencies]
id-resolver = { path = "../id-resolver" }
jira-client = { path = "../jira-client" }
testcase-common = { path = "../testcase-common" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
jira-client = { path = "../jira-client", features = ["mock"] }
tempfile = { workspace = true }
