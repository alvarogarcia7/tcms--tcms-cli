[package]
name = "find-files-by-schema"
version = "0.1.0"
edition = "2021"
description = "Find the YAML and JSON files in a repo that declare a tcms-schemas type"

[[bin]]
name = "find-files-by-schema"
path = "src/main.rs"

[dependencies]
testcase-common = { path = "../testcase-common" }
anyhow = { workspace = true }
clap = { workspace = true }
ignore = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
