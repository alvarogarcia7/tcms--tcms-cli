type: test_case
schema: tcms/test-case.schema.v1.json
requirement: TCMS-47
item: 1
tc: 2
id: TC_TCMS_VV_C2_001
description: >-
  Requirement present but not covered: requirement SUT1-3 is listed in requirements.json and no test case
  cites it, so tcms vv metrics reports NO_CASES for it. The gate is unaffected and PASSED. Happy path only.
general_initial_conditions:
  tooling:
  - jq is installed
initial_conditions:
  repository:
  - the tcms binary is built (TCMS_BIN, default target/debug/tcms)
test_sequences:
- id: 1
  name: Requirement not covered (derived fixture uncovered-requirement)
  description: Requirement SUT1-3 has no test case; the other results are unchanged.
  initial_conditions:
    repository:
    - the derived fixture data is present under crates/tcms/tests/fixtures/vv-metrics
  steps:
  - step: 1
    description: Requirement SUT1-3 is NO_CASES
    command: 'set -o pipefail; "${TCMS_BIN:-target/debug/tcms}" --schemas-root schemas/ vv metrics --root crates/tcms/tests/fixtures/vv-metrics/derived/uncovered-requirement --run RUN-DERIVED-UNCOVERED-01 --now 2026-11-02T10:00:00+04:00 | jq -r ".requirements.items[] | select(.id == \"SUT1-3\") | .coverage"'
    expected:
      success: true
      result: 0
      output: NO_CASES
    verification:
      result: '[[ $EXIT_CODE -eq 0 ]]'
      output: grep -qx 'NO_CASES' <<< "$COMMAND_OUTPUT"
  - step: 2
    description: The requirements summary counts one requirement with no cases
    command: 'set -o pipefail; "${TCMS_BIN:-target/debug/tcms}" --schemas-root schemas/ vv metrics --root crates/tcms/tests/fixtures/vv-metrics/derived/uncovered-requirement --run RUN-DERIVED-UNCOVERED-01 --now 2026-11-02T10:00:00+04:00 | jq -r ".requirements.summary.noCases"'
    expected:
      success: true
      result: 0
      output: '1'
    verification:
      result: '[[ $EXIT_CODE -eq 0 ]]'
      output: grep -qx '1' <<< "$COMMAND_OUTPUT"
  - step: 3
    description: Quality gate verdict is still PASSED
    command: 'set -o pipefail; "${TCMS_BIN:-target/debug/tcms}" --schemas-root schemas/ vv metrics --root crates/tcms/tests/fixtures/vv-metrics/derived/uncovered-requirement --run RUN-DERIVED-UNCOVERED-01 --now 2026-11-02T10:00:00+04:00 | jq -r ".gate.verdict"'
    expected:
      success: true
      result: 0
      output: PASSED
    verification:
      result: '[[ $EXIT_CODE -eq 0 ]]'
      output: grep -qx 'PASSED' <<< "$COMMAND_OUTPUT"
