# Cargo configuration for coverage builds

[build]
# Require llvm-tools-preview component for coverage instrumentation
rustflags = []

# Shared build directory: reuse compiled dependency artifacts across worktrees
#
# Intermediate artifacts (dependency .rlib/.rmeta, incremental data) are written
# to a single directory under CARGO_HOME instead of <worktree>/target, so every
# worktree and checkout of this repository compiles each dependency only once.
# Final artifacts (binaries, test executables) still land in <worktree>/target.
#
# {cargo-cache-home} expands to CARGO_HOME (default ~/.cargo), keeping the path
# portable across machines, users, and CI images. Requires Cargo 1.91+.
#
# Caveat: Cargo takes an exclusive lock on the build directory, so concurrent
# builds in two worktrees serialize ("Blocking waiting for file lock on build
# directory") rather than running in parallel.
build-dir = "{cargo-cache-home}/build/testcase-manager"

# sccache configuration for build caching
#
# SCCACHE_DIR is deliberately NOT set here. Cargo's [env] table does no shell or
# variable expansion, so a value like "$HOME/.cache/sccache/..." is passed through
# literally and makes sccache create a directory named '$HOME' in the build cwd.
# The global cache directory (~/.cache/sccache/testcase-manager, shared across all
# worktrees and checkouts) is exported by scripts/enable-sccache.sh instead, where
# $HOME expands correctly.
#
# To enable sccache for local development:
#   1. Install sccache: make install-sccache
#   2. Enable for this shell: source ./scripts/enable-sccache.sh
#   3. Enable permanently:    source ./scripts/enable-sccache.sh --permanent
#
# CI environments (GitLab CI) set RUSTC_WRAPPER and SCCACHE_DIR in their configuration
# GitHub Actions uses RustCrypto/actions/cargo-cache instead

[target.'cfg(all())']
# Set default RUSTFLAGS for coverage builds with instrument-coverage flag
# This enables source-based code coverage instrumentation
#rustflags = ["-C", "instrument-coverage"]
rustflags = []

# Cargo aliases for coverage-related tasks
[alias]
# Run tests with coverage instrumentation
coverage = "llvm-cov --all-features"

# Generate HTML coverage report and open in browser
coverage-html = "llvm-cov --all-features --html --open"

# Display coverage summary report in terminal
coverage-report = "llvm-cov --all-features --summary-only"

# Clean coverage artifacts
coverage-clean = "llvm-cov clean"

# Run tests with all features enabled (for development without coverage)
test-all = "test --all-features"
