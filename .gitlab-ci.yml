rust:e2e-tests:
  stage: e2e
  image: rust:1.95
  needs:
    - job: rust:build-test-lint
      artifacts: false
  before_script:
    - rustc --version
    - cargo --version
    - apt-get update -qq
    - apt-get install -y -qq curl expect
    - ./scripts/install-sccache.sh --ci
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .sccache
    policy: pull
  script:
    - echo "===== Running E2E Tests ====="
    - cargo build --all --all-features --release
    - make test-e2e 2>&1 | tee e2e_output.txt || true
    - echo "===== sccache Statistics After E2E Tests ====="
    - touch e2e_output.txt
    - sccache --show-stats
  artifacts:
    name: "e2e-artifacts-$CI_COMMIT_REF_SLUG"
    paths:
      - e2e_output.txt
    expire_in: 1 week
    when: always
  tags:
    - dind-amd
