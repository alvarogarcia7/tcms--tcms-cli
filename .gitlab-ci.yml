# ---------------------------------------------------------------------------
# Binary release (TCMS-39)
#
# Builds the Rust binaries for {linux amd64, macos arm64}, packages one zip
# per architecture, and publishes them as a GitLab Release:
#  -Only runs for tags starting with "v" (e.g. v1, v1.0.1, v2-rc1)
#  - The shipped binaries are detected dynamically from the workspace metadata. 
#  - macOS is cross-compiled from the Linux runner using cargo-zigbuild, so no macOS runner is required.
# ---------------------------------------------------------------------------
release:build:
  stage: release
  image: rust:1.95
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+/'
  variables:
    # Disable sccache here; the release job cross-compiles and does not share
    # the build cache used by the rust stage.
    RUSTC_WRAPPER: ""
  before_script:
    - rustc --version
    - cargo --version
    - apt-get update -qq
    - apt-get install -y -qq zip curl jq python3-pip
    # zig provides the cross-linker that lets cargo-zigbuild target macOS from Linux
    - pip3 install --break-system-packages ziglang
    - cargo install --locked cargo-zigbuild
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup target add x86_64-unknown-linux-gnu aarch64-apple-darwin
    # Detect the binaries to ship directly from the workspace metadata so the
    # list stays in sync as crates/binaries are added or removed.
    - export RELEASE_BINS=$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[].targets[] | select((.kind | index("bin")) and ((.["required-features"] // []) | length == 0)) | .name] | unique | join(" ")')
    - echo "Detected release binaries -- $RELEASE_BINS"
  script:
    - mkdir -p dist
    - |
      package() {
        bindir="$1"; label="$2"
        echo "===== Packaging $label from $bindir ====="
        stage="testcase-manager-${CI_COMMIT_TAG}-${label}"
        rm -rf "$stage"; mkdir -p "$stage"
        for b in $RELEASE_BINS; do
          cp "${bindir}/${b}" "$stage/"
        done
        cp README.md README_INSTALL.md "$stage/" 2>/dev/null || true
        (cd "$stage" && zip -r "../dist/${stage}.zip" .)
      }
    # Linux amd64: build natively on the x86_64 Linux runner. C deps (openssl
    # via git2/native-tls, etc.) resolve through pkg-config exactly as they do
    # in the Docker image build, which compiles the whole workspace fine.
    - echo "===== Building linux-amd64 (native) ====="
    - cargo build --release --workspace --bins
    - package "target/release" "linux-amd64"
    # macOS arm64: cross-compile from Linux with cargo-zigbuild. Kept non-fatal
    # for now -- some C deps still need cross-build work (openssl headers under
    # zig) and a macOS hiccup must not block shipping/testing the linux archive.
    - |
      echo "===== Building macos-arm64 (cross via zig) ====="
      if cargo zigbuild --release --target aarch64-apple-darwin --workspace --bins; then
        package "target/aarch64-apple-darwin/release" "macos-arm64"
      else
        echo "WARNING: macos-arm64 cross-compile failed; skipping its archive this build."
      fi
    - ls -la dist/
    # Upload each archive to the project's generic package registry so the
    # release can link to a stable download URL.
    - |
      PACKAGE_REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/testcase-manager/${CI_COMMIT_TAG}"
      for z in dist/*.zip; do
        fname=$(basename "$z")
        echo "Uploading $fname -> ${PACKAGE_REGISTRY_URL}/${fname}"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$z" \
          "${PACKAGE_REGISTRY_URL}/${fname}"
      done
  artifacts:
    name: "release-$CI_COMMIT_TAG"
    paths:
      - dist/*.zip
    expire_in: never
  tags:
    - dind-amd

release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release:build
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+/'
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/testcase-manager/${CI_COMMIT_TAG}"
  script:
    - echo "Publishing GitLab release for ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: 'Binary release of tcms-cli for $CI_COMMIT_TAG (linux amd64, macos arm64).'
    assets:
      links:
        - name: 'testcase-manager-$CI_COMMIT_TAG-linux-amd64.zip'
          url: '${PACKAGE_REGISTRY_URL}/testcase-manager-$CI_COMMIT_TAG-linux-amd64.zip'
          link_type: 'package'
        - name: 'testcase-manager-$CI_COMMIT_TAG-macos-arm64.zip'
          url: '${PACKAGE_REGISTRY_URL}/testcase-manager-$CI_COMMIT_TAG-macos-arm64.zip'
          link_type: 'package'

# Test case file names: id equals the file name, extension .yml. The script decides whether anything
# below testcases/ or test-acceptance/ changed (nothing to check -> exit 0) and checks only the changed
# files, so this job runs on every branch and merge request pipeline.
check:testcase-files:
  stage: rust
  image: python:3.12-slim
  variables:
    GIT_DEPTH: "0"
  rules:
    # Not in merge request pipelines: a rule that matches them would create a merge request pipeline
    # holding only this job, which then replaces the full branch pipeline as the MR's head pipeline.
    - if: '$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        BASE="$CI_COMMIT_BEFORE_SHA"
      else
        git fetch -q origin "$CI_DEFAULT_BRANCH"
        BASE="$(git merge-base "origin/$CI_DEFAULT_BRANCH" HEAD)"
      fi
    - python3 -m unittest scripts/test_check_testcase_files.py
    - python3 scripts/check_testcase_files.py --changed-since "$BASE"

# Acceptance suite (make acceptance-test): all stages, including the documentation stages that need the
# test-plan-documentation-generator (TPDG). The TPDG release is downloaded by scripts/download-tpdg.sh
# (version: TPDG_VERSION, default v0.1.0-rc.1). It needs access to the TPDG project (id 350): either
#   - add this project to the TPDG project's job token allowlist (Settings > CI/CD > Job token
#     permissions), then the job's CI_JOB_TOKEN is enough; or
#   - set a masked CI/CD variable TPDG_TOKEN (a token with read_api on the TPDG project).
# allow_failure until it has run green on the runners once; then remove it.
acceptance:test:
  stage: e2e
  image: rust:1.95
  needs:
    - job: rust:build-test-lint
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  allow_failure: true
  variables:
    TPDG_VERSION: "v0.1.0-rc.1"
  before_script:
    - rustc --version
    - cargo --version
    - apt-get update -qq
    - apt-get install -y -qq curl jq expect
    # uv + Python 3.14: the acceptance scripts run python through `uv run python3.14`
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env || true
    - export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
    - uv python install 3.14
    - uv sync --python 3.14
    - ./scripts/install-sccache.sh --ci
  script:
    - ./scripts/download-tpdg.sh
    - export TEST_PLAN_DOC_GEN="$CI_PROJECT_DIR/tools/tpdg/tpdg"
    - "$TEST_PLAN_DOC_GEN --help | head -1"
    - make acceptance-test
    - sccache --show-stats
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .sccache
    policy: pull
  artifacts:
    name: "acceptance-$CI_COMMIT_REF_SLUG"
    paths:
      - test-acceptance/reports/
      - test-acceptance/20_verification/
    expire_in: 1 week
    when: always
  tags:
    - dind-amd

# TCMS-42.9: Jira write-back for one product. It runs on every default-branch pipeline (D-42.9d):
# the repo and GitLab have no marker of a results merge (no predefined variable, no results
# branch naming), so the default branch is the condition, and the apply only there. Not verified
# here: this pipeline cannot run GitLab CI in the authoring environment. Hidden template, then the
# job for the default branch. Set in CI/CD variables (masked): TCMS_INTEGRATION_CONFIG (path in
# the repo), TCMS_PRODUCT (product_id), the token named by auth.secret_ref in the config
# (for example TCMS_JIRA_TOKEN) and TCMS_JIRA_USER (service account, Cloud). The job applies;
# the sync is a dry run anywhere else (run it with `tcms jira sync --product ...` by hand).
# The mode is chosen in the script: --apply only when CI_COMMIT_BRANCH is CI_DEFAULT_BRANCH.
.tcms-jira-sync:
  stage: e2e
  image: rust:1.95
  variables:
    CARGO_INCREMENTAL: "0"
    TCMS_STATE_DIR: ".tcms/jira-sync"
  before_script:
    - rustc --version
    - cargo --version
  script:
    - cargo build -p tcms --release
    # the default branch applies; any other branch is a dry run (D-42.4n)
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then MODE=--apply; else MODE=--dry-run; fi
      echo "tcms jira sync for $TCMS_PRODUCT: $MODE"
      ./target/release/tcms --config "$TCMS_INTEGRATION_CONFIG" \
        jira sync --product "$TCMS_PRODUCT" "$MODE" \
        --as "${TCMS_USER:-$GITLAB_USER_LOGIN}" --state-dir "$TCMS_STATE_DIR"
  artifacts:
    name: "jira-sync-$CI_COMMIT_REF_SLUG"
    paths:
      - .tcms/jira-sync/audit/
    when: always
    expire_in: 90 days

tcms:jira-sync:
  extends: .tcms-jira-sync
  rules:
    - if: '$TCMS_PRODUCT && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$TCMS_PRODUCT'
      when: manual
      allow_failure: true
